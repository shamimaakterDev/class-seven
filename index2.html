<!DOCTYPE html>
<html lang="en">
<head>

<body>

        <div class="box">
             <h1>Students Regstration form</h1>
             <form>
                <label for="">Roll no:</label>

                <br>
                <label>Student name :</label>
                <input type="text" placeholder="First Name"  style="height: 20px;" >
                - <input type="text" placeholder=" Last Name"  style="height: 20px;">
                    <br>
                    <br>
                <label for="">Father's Name:</label>
                <input type="text"  style="height: 20px;">

                    <br>
                <label for="">Mather's Name:</label>
                <input type="text"  style="height: 20px;">
                 <br>
                 <br>

               - <input type="text" placeholder="Month" style="width: 40px;">
               - <input type="text" placeholder="Year" style="width: 40px;">
                (DD-MM-YYYY )

                 <br>
                  <label for="">Email id :</label>

                 <br>

                 <br>

                 <br>

                 <br>

                <input type="text"  style="height: 20px;">
